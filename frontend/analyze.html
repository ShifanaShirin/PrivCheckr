<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Analyze Privacy Policy | PrivCheckr</title>

  <style>
    :root {
      --bg: #020617;
      --panel: #0b1220;
      --border: #1e293b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* NAVBAR */

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-weight: 600;
      color: var(--primary);
      font-size: 18px;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    /* HEADER */

    .header {
      max-width: 1100px;
      margin: auto;
      padding: 50px 40px 30px;
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    /* MAIN */

    .main {
      max-width: 1100px;
      margin: auto;
      padding: 0 40px 80px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 40px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }

    textarea {
      width: 100%;
      height: 260px;
      margin-top: 12px;
      padding: 16px;
      background: #020617;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: none;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: #020617;
    }

    button:hover {
      background: #0ea5e9
    }

    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .low {
      background: #16a34a;
      color: #020617
    }

    .medium {
      background: #facc15;
      color: #020617
    }

    .high {
      background: #ef4444;
      color: white
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 25px;
      font-size: 13px;
      color: var(--muted);
    }

    /* DPDP SCORE BAR */

    .score-bar {
      width: 100%;
      background: #1e293b;
      border-radius: 8px;
      height: 10px;
      margin-top: 6px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      background: #22c55e;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* RISK METER */

    .risk-box {
      padding: 10px 14px;
      border-radius: 8px;
      display: inline-block;
      font-weight: 600;
      margin-top: 6px;
    }

    .risk-low {
      background: #22c55e33;
      color: #22c55e;
    }

    .risk-medium {
      background: #facc1533;
      color: #facc15;
    }

    .risk-high {
      background: #ef444433;
      color: #ef4444;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <a href="/dashboard.html" class="logo">PrivCheckr</a>
    <div class="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/about.html">About</a>
      <a href="/faq.html">FAQ</a>
      <a href="#" onclick="logout()" style="color:#ef4444">Logout</a>
    </div>
  </nav>

  <div class="header">
    <h1>Analyze Privacy Policy</h1>
    <p style="color:var(--muted)">
      Paste a privacy policy below to understand risks and DPDP compliance.
    </p>
  </div>

  <div class="main">

    <div class="card">
      <h3>Privacy Policy Text</h3>
      <textarea id="policyText" placeholder="Paste privacy policy text here..."></textarea>
      <button onclick="analyzePolicy()">Analyze Policy</button>
    </div>

    <div class="card">
      <h3>Analysis Result</h3>
      <div id="output">
        <p style="color:var(--muted)">
          Results will appear here after analysis.
        </p>
      </div>
    </div>

  </div>

  <footer>
    © 2026 PrivCheckr — Secure AI Privacy Analysis
  </footer>

  <script>

    // ===== PROTECT PAGE =====
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "/login.html";
    }

    // ===== LOGOUT =====
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/";
    }

    // ===== ANALYZE FUNCTION =====
    async function analyzePolicy() {

      const text = document.getElementById("policyText").value.trim();
      const output = document.getElementById("output");

      if (!text) {
        alert("Please paste a privacy policy.");
        return;
      }

      output.innerHTML = "<p style='color:#94a3b8'>Analyzing...</p>";

      try {

        const res = await fetch("/analyze", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ policy_text: text })
        });

        const data = await res.json();

        if (!res.ok) {
          output.innerHTML = `
        <p style="color:#ef4444">
          ${data.detail || "Analysis failed."}
        </p>`;
          return;
        }

        let riskClass = "low";
        if (data.risk_level === "Medium") riskClass = "medium";
        if (data.risk_level === "High") riskClass = "high";

        output.innerHTML = `

<p><b>Detected Language:</b> ${data.detected_language}</p>

<p><b>Data Types Detected:</b> 
${data.data_types.length ? data.data_types.join(", ") : "None"}
</p>

<p><b>DPDP Score:</b> ${data.dpdp_score}</p>

<p>
<b>Risk Level:</b>
<span class="badge ${riskClass}">
${data.risk_level}
</span>
</p>

<hr style="border-color:#1e293b">

<h4>DPDP Compliance Breakdown</h4>

<ul>
<li>Consent: ${data.dpdp_breakdown.consent ? "✔ Present" : "✖ Missing"}</li>
<li>Purpose Limitation: ${data.dpdp_breakdown.purpose ? "✔ Present" : "✖ Missing"}</li>
<li>Data Retention: ${data.dpdp_breakdown.retention ? "✔ Present" : "✖ Missing"}</li>
<li>User Rights: ${data.dpdp_breakdown.user_rights ? "✔ Present" : "✖ Missing"}</li>
<li>Grievance Mechanism: ${data.dpdp_breakdown.grievance ? "✔ Present" : "✖ Missing"}</li>
</ul>

<hr style="border-color:#1e293b">

<h4>Explanation</h4>
<ul>
${data.explanation.map(e => `<li>${e}</li>`).join("")}
</ul>

<hr style="border-color:#1e293b">

<h4>Recommendations</h4>
<ul>
${data.recommendations.map(r => `<li>${r}</li>`).join("")}
</ul>

`;

      } catch {
        output.innerHTML =
          "<p style='color:#ef4444'>Unable to connect to backend.</p>";
      }
    }

  </script>

</body>

</html>

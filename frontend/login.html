<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | PrivCheckr</title>

<style>
:root{
  --bg:#020617;
  --panel:#020617;
  --border:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --primary:#38bdf8;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 40px;
  border-bottom:1px solid var(--border);
}
nav .logo{
  font-weight:600;
  color:var(--primary);
}
nav a{
  margin-left:25px;
  color:var(--muted);
  text-decoration:none;
  font-size:14px;
}
nav a:hover{color:var(--primary)}

/* CARD */
.container{
  min-height:calc(100vh - 80px);
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:420px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:32px;
}

.card h1{
  margin-top:0;
  color:var(--primary);
  text-align:center;
}

.card p{
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

label{
  display:block;
  margin-top:18px;
  font-size:14px;
}

input{
  width:100%;
  margin-top:6px;
  padding:12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
}

button{
  margin-top:24px;
  width:100%;
  padding:14px;
  background:var(--primary);
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  color:#020617;
}
button:hover{background:#0ea5e9}

.footer-text{
  text-align:center;
  margin-top:14px;
  font-size:13px;
  color:var(--muted);
}
.footer-text a{
  color:var(--primary);
  text-decoration:none;
}

/* RESET MODAL */
#resetBox{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}
</style>
</head>

<body>

<nav>
  <div class="logo">PrivCheckr</div>
  <div>
    <a href="index.html">Home</a>
    <a href="analyze.html">Analyze</a>
    <a href="about.html">About</a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <h1>Welcome Back</h1>
    <p>Login to access PrivCheckr</p>

    <label>Email Address</label>
    <input id="loginEmail" type="email" placeholder="you@example.com">

    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="••••••••">

    <button onclick="return validateLogin()">Login</button>

    <div class="footer-text">
      <a href="#" onclick="openReset()">Forgot password?</a>
    </div>

    <div class="footer-text">
      Don’t have an account?
      <a href="register.html">Create one</a>
    </div>
  </div>
</div>

<!-- RESET PASSWORD MODAL -->
<div id="resetBox">
  <div style="background:#020617;border:1px solid #1e293b;
  border-radius:12px;padding:30px;width:380px;text-align:center;">
    <h3 style="color:#38bdf8">Reset Password</h3>
    <p style="color:#94a3b8;font-size:14px">
      Enter your registered email
    </p>

    <input id="resetEmail" type="email" placeholder="you@example.com"
      style="width:100%;padding:12px;border-radius:8px;
      border:1px solid #1e293b;background:#020617;color:#e5e7eb;margin-top:12px;">

    <button style="margin-top:16px;width:100%;padding:12px;
      background:#38bdf8;border:none;border-radius:8px;font-weight:600;"
      onclick="sendReset()">Send Reset Link</button>

    <p style="margin-top:12px;font-size:13px">
      <a href="#" onclick="closeReset()" style="color:#38bdf8">Cancel</a>
    </p>
  </div>
</div>

<script>
function validateLogin(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if(!email || !password){
    alert("Please fill in all fields.");
    return false;
  }

  if(!email.includes("@")){
    alert("Please enter a valid email address.");
    return false;
  }

  if(password.length < 6){
    alert("Password must be at least 6 characters.");
    return false;
  }

  alert("Login validation successful (backend integration pending).");
  return false;
}

function openReset(){
  document.getElementById("resetBox").style.display = "flex";
}

function closeReset(){
  document.getElementById("resetBox").style.display = "none";
}

function sendReset(){
  const email = document.getElementById("resetEmail").value.trim();
  if(!email || !email.includes("@")){
    alert("Please enter a valid email.");
    return;
  }
  alert("Password reset link sent (demo only).");
  closeReset();
}
</script>

</body>
</html>
